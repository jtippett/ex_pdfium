[package]
name = "ex_pdfium"
version = "0.1.0"
edition = "2021"
# Minimum supported Rust. The shipped NIF is precompiled (CI builds with stable),
# so this only constrains rare from-source consumer builds — keep it recent rather
# than artificially low. Bump freely when a newer std/lang feature helps.
rust-version = "1.82"

[lib]
name = "ex_pdfium"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
# DEV/TEST default: dynamic binding. pdfium-render compiles with NO pdfium
# present and loads libpdfium at runtime (Pdfium::bind_to_library).
#
# `thread_safe` is load-bearing and must always be on. We keep ONE global Pdfium
# in a `static`, which needs `unsafe impl Send + Sync for Pdfium` — and
# pdfium-render gates that impl behind `thread_safe` (0.9.x removed the old
# `sync` feature and moved the Send+Sync markers here). NOTE: do NOT rely on
# `thread_safe` to serialize pdfium work. 0.9.3 had no mutex at all; 0.9.4+
# (verified against 0.9.5, src/bindings/thread_safe.rs) wraps each individual
# FPDF_* call in a global mutex, but that lock is per-call — it does not hold
# across a multi-call operation (load -> render -> close). We serialize every
# operation with our own global lock in src/lib.rs (`PDFIUM_LOCK`), always
# taken first, so the two locks nest in one fixed order. Never call pdfium from
# inside a reader/writer/font-provider callback: the per-call mutex is not
# reentrant and would deadlock.
default = ["thread_safe"]
thread_safe = ["pdfium-render/thread_safe"]

# OPTIONAL static linking. NOTE: the shipped release does NOT use these — it
# bundles the dynamic libpdfium beside the NIF (bblanchon publishes no static
# libpdfium.a, only the dynamic lib; see HANDOFF). These remain for anyone who
# supplies their own libpdfium.a via PDFIUM_STATIC_LIB_PATH. `static` needs that
# env var at build time; the C++ stdlib differs by target — pick exactly one:
#   linux-gnu/musl -> libstdcpp ; apple-darwin -> libcpp. Verified against
# pdfium-render 0.9.5: `libc++`/`libstdc++` each already imply `static`.
static = ["pdfium-render/static"]
libstdcpp = ["pdfium-render/libstdc++"]
libcpp = ["pdfium-render/libc++"]

[dependencies]
rustler = "0.38"
# `dladdr`, to locate the NIF's own directory at runtime so it can load a
# libpdfium bundled beside it in the precompiled tarball (see src/lib.rs).
libc = "0.2"

# pdfium-render is published to crates.io; pin it exactly (bump via UPDATE_PROCEDURE).
#
# `default-features = false` drops the crate's heavy `image` default (the `image`
# crate + its deps), which we don't need yet. But the default ALSO carries a
# mandatory pdfium API-version feature (`pdfium_latest` -> `pdfium_8125`): without
# one selected, pdfium-render has no FFI surface to bind. So re-add it here as a
# non-optional dependency feature, so it's always on regardless of which crate
# features are toggled. Keep the bundled pdfium binary (PDFIUM_TAG) at
# chromium/8125 to match this API version.
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_latest"] }
