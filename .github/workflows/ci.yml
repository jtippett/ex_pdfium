name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # pdfium binary pin. Must match pdfium-render's bound API (pdfium_latest ==
  # pdfium_7543 for the pinned 0.8.37). Bump via UPDATE_PROCEDURE.
  PDFIUM_TAG: "chromium/7543"

jobs:
  test:
    name: Test & lint (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # NIF ABI is backward-compatible, so one OTP exercises the code. The
          # release artifact (built against rustler's NIF version) loads on 27/28/29+.
          # Elixir tracks local dev (1.20.x): `mix format` is Elixir-version-specific,
          # so matching versions keeps the formatter check in lockstep. The library
          # itself still targets `~> 1.17` (plain Elixir; nothing 1.20-only).
          - otp: "27.2"
            elixir: "1.20.1"
    env:
      MIX_ENV: test
      EXPDFIUM_BUILD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache mix deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/ex_pdfium/target
          key: cargo-${{ runner.os }}-${{ hashFiles('native/ex_pdfium/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Tests use the dynamic pdfium binding — download libpdfium for the runner.
      - name: Download libpdfium (dynamic, for tests)
        run: |
          mkdir -p priv/pdfium
          url="https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG/\//%2F}/pdfium-linux-x64.tgz"
          curl -fsSL "$url" -o pdfium.tgz
          expected="$(awk '$2 == "pdfium-linux-x64.tgz" { print $1 }' PDFIUM_SHA256SUMS)"
          actual="$(shasum -a 256 pdfium.tgz | awk '{ print $1 }')"
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "libpdfium checksum mismatch for pdfium-linux-x64.tgz" >&2
            exit 1
          fi
          tar -xzf pdfium.tgz -C priv/pdfium lib/libpdfium.so
          mv priv/pdfium/lib/libpdfium.so priv/pdfium/
          rmdir priv/pdfium/lib || true

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check Elixir formatting
        run: mix format --check-formatted

      - name: Check Rust formatting
        working-directory: native/ex_pdfium
        run: cargo fmt --check

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Clippy
        working-directory: native/ex_pdfium
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: mix test
